name: Web checks
on: [push, pull_request]
jobs:
  check:
    # Exercise the iPad WebKit project on Apple's native graphics stack. WebKit
    # crashes on page load with the Ubuntu runner's headless graphics environment.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm run storybook:build
      - run: npm run storybook:test
