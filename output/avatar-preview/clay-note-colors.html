    const palettes = JSON.parse(root.querySelector('#rp-note-palette').textContent);
    const notes = ['C','D','E','F','G','A','B'];
    const solfege = ['Do','Ré','Mi','Fa','Sol','La','Si'];
    const settings = { theme: 'acid', ground: 'Pale tint' };
    let selectedNote = 'A', selectedFace = 7, batch = 6;
    const colorButtons = notes.map((note, i) => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'rp-color cursor-interaction';
      button.setAttribute('aria-label', note + ' · ' + solfege[i]);
      const image = document.createElement('img'); image.alt = '';
      const label = document.createElement('span'); label.textContent = note;
      button.append(image, label); root.querySelector('.rp-colors').append(button);
      button.addEventListener('click', () => { selectedNote = note; render(); persist(); });
      return button;
    });
    const faceButtons = Array.from({length: 6}, (_, i) => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'rp-face cursor-interaction';
      const image = document.createElement('img'); image.alt = ''; button.append(image);
      button.addEventListener('click', () => { selectedFace = batch + i; render(); persist(); });
      root.querySelector('.rp-faces').append(button);
      return button;
    });
    function mix(hex, background, amount) {
      const channels = [1,3,5].map(offset => Math.round(parseInt(hex.slice(offset,offset+2),16)*amount + parseInt(background.slice(offset,offset+2),16)*(1-amount)));
      return '#' + channels.map(value => value.toString(16).padStart(2,'0')).join('');
    }
    function avatar(face, note) {
      const palette = palettes[settings.theme];
      const color = palette['note-' + note.toLowerCase()];
      const accent = palette['note-' + note.toLowerCase() + '-active'];
      const ground = settings.ground === 'Pale tint' ? mix(color, '#ffffff', .14) : mix(color, palette.background, .17);
      const svg = templates[face].replaceAll('#ff0001', color).replaceAll('#ff0002', accent).replaceAll('#ff0003', ground);
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    function render() {
      const palette = palettes[settings.theme];
      const color = palette['note-' + selectedNote.toLowerCase()];
      root.style.setProperty('--chosen', color);
      root.querySelector('.rp-large').src = avatar(selectedFace, selectedNote);
      root.querySelector('.rp-mini').src = avatar(selectedFace, selectedNote);
      root.querySelector('.rp-dot').style.background = color;
      root.querySelector('.rp-selected-label').textContent = selectedNote + ' · ' + solfege[notes.indexOf(selectedNote)] + ' · ' + color.toUpperCase();
      colorButtons.forEach((button,i) => {
        button.querySelector('img').src = avatar(selectedFace, notes[i]);
        button.style.setProperty('--note', palette['note-' + notes[i].toLowerCase()]);
        button.setAttribute('aria-pressed', String(notes[i] === selectedNote));
      });
      faceButtons.forEach((button,i) => {
        button.querySelector('img').src = avatar(batch + i, selectedNote);
        button.setAttribute('aria-label', 'Character ' + (batch + i + 1));
        button.setAttribute('aria-pressed', String(batch + i === selectedFace));
      });
    }
    function restore(state) {
      const saved = state?.modelContent;
      if (!saved) return;
      if (notes.includes(saved.note)) selectedNote = saved.note;
      if (Number.isInteger(saved.character) && saved.character >= 0 && saved.character < templates.length) selectedFace = saved.character;
      if (palettes[saved.theme]) settings.theme = saved.theme;
      if (['Pale tint','Dark tint'].includes(saved.ground)) settings.ground = saved.ground;
      batch = Math.floor(selectedFace / 6) * 6;
    }
    function persist() {
      if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent: {note: selectedNote, character: selectedFace, theme: settings.theme, ground: settings.ground}, privateContent: null}).catch(() => {});
    }
    root.querySelector('.rp-shuffle').addEventListener('click', () => { batch = (batch + 6) % templates.length; render(); });
    restore(window.openai?.widgetState);
    window.addEventListener('openai:set_globals', event => { restore(event.detail?.globals?.widgetState); render(); });
    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({container: root.querySelector('.rp-picker'), onChange: () => { render(); persist(); }});
      tweak.addSelect(settings, 'ground', {label: 'Avatar background', options: ['Pale tint', 'Dark tint']});
      tweak.addSelect(settings, 'theme', {label: 'Note palette', options: [{label: 'Acid (default)', value: 'acid'}, {label: 'Amber', value: 'amber'}, {label: 'Hotwire', value: 'hotwire'}]});
    }
  })();
  </script>
</div>
